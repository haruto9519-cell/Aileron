<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1c">
<meta name="description" content="3レーンを切り替えて障害物を避け、エネルギーを集める無料アーケードゲーム PULSE RUN。">
<title>PULSE RUN — Aileron Game Studio</title>
<style>
:root{color-scheme:dark;--bg:#080d1c;--panel:#111c32;--cyan:#5deaff;--pink:#ff6fba;--gold:#ffd477;--muted:#9aabc5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#233e68 0,transparent 48%),var(--bg);color:#f5f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px 12px 28px}
main{width:min(100%,560px)}header{text-align:center;margin:5px 0 16px}.brand{font-size:10px;letter-spacing:.3em;color:var(--gold);font-weight:900}.logo{font-size:clamp(38px,10vw,56px);letter-spacing:.1em;line-height:1;margin:8px 0}.tag{font-size:12px;color:var(--muted);letter-spacing:.12em}
.panel{border:1px solid #304565;border-radius:22px;background:linear-gradient(150deg,#142541,#0d172a);padding:13px;box-shadow:0 20px 60px #0007}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.stat{background:#091326;border:1px solid #263c5d;border-radius:12px;text-align:center;padding:8px}.stat small{display:block;font-size:10px;color:var(--muted)}.stat strong{font-size:21px;font-variant-numeric:tabular-nums}
.stage{position:relative;overflow:hidden;border-radius:15px;border:1px solid #314969;background:#070e1d;line-height:0}canvas{width:100%;height:auto;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#050b18b8;padding:20px;text-align:center}.overlay.hidden{display:none}.card{max-width:310px}.card h2{font-size:28px;letter-spacing:.08em;margin:0 0 8px}.card p{font-size:13px;color:#c1cee0;line-height:1.8;margin:0 0 18px}
button{font:inherit;cursor:pointer}.start{border:0;border-radius:999px;background:linear-gradient(120deg,#ffe39a,#ffc85b);color:#172239;padding:13px 28px;font-weight:950;letter-spacing:.06em}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.lane{border:1px solid #385477;background:#172a47;color:#e9f5ff;border-radius:12px;padding:12px 4px;font-size:12px;font-weight:850}.lane:active{background:#24476d}
.tip{text-align:center;color:var(--muted);font-size:11px;line-height:1.7;margin:12px 4px 0}.bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px}.small{border:1px solid #354c6d;background:transparent;color:#c5d2e5;border-radius:999px;padding:8px 13px;font-size:11px}.note{font-size:10px;color:#7185a4;text-align:center;margin:15px 0}
@media(min-width:520px){.panel{padding:17px}.controls{max-width:360px;margin:12px auto 0}}
</style>
</head>
<body><main>
<header><div class="brand">AILERON GAME STUDIO</div><h1 class="logo">PULSE RUN</h1><div class="tag">DODGE · COLLECT · SURVIVE</div></header>
<section class="panel">
<div class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>ENERGY</small><strong id="energy">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div></div>
<div class="stage">
<canvas id="game" width="480" height="640" aria-label="3レーンのランゲーム"></canvas>
<div class="overlay" id="overlay"><div class="card"><h2 id="headline">READY?</h2><p id="description">3つのレーンを移動して、赤いブロックを避けよう。光るエネルギーを集めて、できるだけ長く走り続けよう！</p><button class="start" id="start">PLAY NOW</button></div></div>
</div>
<div class="controls"><button class="lane" data-lane="0">← LEFT</button><button class="lane" data-lane="1">CENTER</button><button class="lane" data-lane="2">RIGHT →</button></div>
<p class="tip">スマホ：画面の左右をタップ、または下のボタン。<br>PC：← → キーで移動。障害物を避けてエネルギーを集めよう。</p>
<div class="bottom"><button class="small" id="pause">Ⅱ PAUSE</button><span class="tip" style="margin:0">記録はこの端末に保存</span><button class="small" id="sound">♪ SOUND OFF</button></div>
</section><p class="note">© 2026 AILERON GAME STUDIO · PULSE RUN</p>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const W=480,H=640,lanes=[112,240,368];
let state='ready',lane=1,score=0,energy=0,best=Number(localStorage.getItem('pulserun-best')||0),objects=[],last=0,spawn=0,speed=250,sound=false,audio=null,frame=0;
$('best').textContent=best;
function beep(f=600){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.1)}catch{}}
function reset(){lane=1;score=0;energy=0;objects=[];speed=250;spawn=0;last=0;$('score').textContent='0';$('energy').textContent='0'}
function start(){reset();state='playing';$('overlay').classList.add('hidden');requestAnimationFrame(loop)}
function end(){state='over';score=Math.floor(score);if(score>best){best=score;localStorage.setItem('pulserun-best',String(best));$('best').textContent=best}$('headline').textContent='RUN OVER';$('description').textContent='SCORE '+score+' ／ ENERGY '+energy+'。もう一度挑戦してベスト記録を更新しよう！';$('start').textContent='TRY AGAIN';$('overlay').classList.remove('hidden');beep(180)}
function move(n){if(state!=='playing')return;lane=Math.max(0,Math.min(2,n));beep(440+lane*80)}
function spawnObject(){const obstacle=Math.random()<.68;let l=Math.floor(Math.random()*3);objects.push({lane:l,y:-35,type:obstacle?'block':'orb',size:obstacle?25:13,passed:false});if(!obstacle&&Math.random()<.28){let l2=(l+1+Math.floor(Math.random()*2))%3;objects.push({lane:l2,y:-110,type:'orb',size:13,passed:false})}}
function draw(){ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#0a1830');grad.addColorStop(1,'#050b18');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#1c3556';ctx.lineWidth=2;for(let x of [176,304]){ctx.setLineDash([16,17]);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([]);
for(let i=0;i<22;i++){const y=(i*38+(frame*speed*.35)%38)%H;ctx.fillStyle='#294568';ctx.fillRect(238,y,4,8)}
objects.forEach(o=>{const x=lanes[o.lane];if(o.type==='block'){ctx.shadowBlur=18;ctx.shadowColor='#ff4c91';ctx.fillStyle='#ff5b94';roundRect(x-27,o.y-25,54,50,10);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffb0d0';ctx.lineWidth=2;roundRect(x-27,o.y-25,54,50,10);ctx.stroke()}else{ctx.shadowBlur=22;ctx.shadowColor='#59eaff';ctx.fillStyle='#6bf0ff';ctx.beginPath();ctx.arc(x,o.y,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-4,o.y-4,4,0,Math.PI*2);ctx.fill()}});
const px=lanes[lane],py=535;ctx.save();ctx.translate(px,py);ctx.shadowBlur=24;ctx.shadowColor='#62eaff';ctx.fillStyle='#62eaff';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(22,17);ctx.lineTo(0,9);ctx.lineTo(-22,17);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f5ffff';ctx.beginPath();ctx.arc(0,-5,5,0,Math.PI*2);ctx.fill();ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function loop(t){if(state!=='playing')return;const dt=Math.min((t-(last||t))/1000,.04);last=t;frame+=dt;score+=dt*10;speed=Math.min(470,250+score*.22);spawn-=dt;if(spawn<=0){spawnObject();spawn=Math.max(.38,1.05-score/1800)*(0.72+Math.random()*.55)}
objects.forEach(o=>{o.y+=speed*dt;if(!o.passed&&o.lane===lane&&Math.abs(o.y-535)<34){o.passed=true;if(o.type==='block'){draw();end();return}else{energy++;score+=35;$('energy').textContent=energy;beep(920)}}});if(state!=='playing')return;objects=objects.filter(o=>o.y<H+40);$('score').textContent=Math.floor(score);draw();requestAnimationFrame(loop)}
function togglePause(){if(state==='playing'){state='paused';$('headline').textContent='PAUSED';$('description').textContent='準備ができたら再開しよう。';$('start').textContent='RESUME';$('overlay').classList.remove('hidden')}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');last=0;requestAnimationFrame(loop)}}
$('start').addEventListener('click',()=>{if(state==='paused'){state='playing';$('overlay').classList.add('hidden');last=0;requestAnimationFrame(loop)}else start()});
$('pause').addEventListener('click',()=>{if(state==='playing')togglePause();else if(state==='paused')togglePause()});
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'♪ SOUND ON':'♪ SOUND OFF';beep(700)});
document.querySelectorAll('[data-lane]').forEach(b=>b.addEventListener('click',()=>move(Number(b.dataset.lane))));
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(lane-1)}if(e.key==='ArrowRight'){e.preventDefault();move(lane+1)}if(e.code==='Space'&&(state==='ready'||state==='over')){e.preventDefault();start()}if(e.key==='Escape'&&state==='playing')togglePause()});
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;move(x<W/2?lane-1:lane+1)});
function idle(){if(state==='ready'||state==='over'||state==='paused'){frame+=.016;draw();requestAnimationFrame(idle)}}draw();idle();
})();
</script></body></html>
