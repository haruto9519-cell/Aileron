name: Kaimamo browser tests

on:
  push:
    paths:
      - 'kaimamo/**'
      - '.github/workflows/kaimamo-e2e.yml'
  pull_request:
    paths:
      - 'kaimamo/**'
      - '.github/workflows/kaimamo-e2e.yml'
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaimamo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
