name: Generate Japan travel video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and offline voice
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Generate video
        run: python video-studio/generate.py

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: aileron-japan-vlog
          path: output/aileron-japan-vlog.mp4
          if-no-files-found: error
          retention-days: 7
